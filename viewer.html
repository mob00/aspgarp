<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASPGARP model viewer</title>
<style>
  body { margin: 1rem; font: 13px monospace; }
  .status { white-space: pre-wrap; }
  .status:empty { display: none; }
  .diagrams > section { min-width: 0; }
  h2 { font-size: 1rem; }
  @media (min-width: 900px) {
    .with-state { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  }
  svg { display: block; width: 100%; height: auto; touch-action: none; }
  #state-graph { max-width: 100%; }
  .node { cursor: grab; }
  .node:active { cursor: grabbing; }
  .node rect { fill: white; stroke: black; }
  text { text-anchor: middle; dominant-baseline: middle; }
  .landmarks, .edge text { font-size: 11px; }
  .edge path { fill: none; stroke: black; }
  .edge text { paint-order: stroke; stroke: white; stroke-width: 4px; }
</style>
<main class="diagrams">
  <section>
    <h2>Causal model</h2>
    <p id="status" class="status" role="status">Loading model…</p>
    <svg id="diagram" aria-label="Causal model">
      <defs>
        <marker id="arrow" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto">
          <path d="M 0 0 L 7 3.5 L 0 7 Z"></path>
        </marker>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
  </section>
  <section id="state-panel" hidden>
    <h2>State graph</h2>
    <p id="state-status" class="status" role="status"></p>
    <img id="state-graph" alt="State graph" draggable="false" hidden>
  </section>
</main>
<script>
const svg = document.querySelector("#diagram");
const diagrams = document.querySelector(".diagrams");
const statePanel = document.querySelector("#state-panel");
const stateStatus = document.querySelector("#state-status");
const stateGraph = document.querySelector("#state-graph");
const status = document.querySelector("#status");
const nodeLayer = document.querySelector("#nodes");
const edgeLayer = document.querySelector("#edges");
let current, drag, saveError, latest;

function element(tag, attributes, parent) {
  const result = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attributes)) result.setAttribute(key, value);
  parent.append(result);
  return result;
}

function nodePoint(event) {
  return new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());
}

function boundary(node, x, y) {
  const dx = x - node.x, dy = y - node.y;
  const scale = 1 / (Math.max(Math.abs(dx) / node.halfWidth, Math.abs(dy) / node.halfHeight) || 1);
  return [node.x + dx * scale, node.y + dy * scale];
}

function draw() {
  for (const node of current.nodes.values()) {
    node.element.setAttribute("transform", `translate(${node.x},${node.y})`);
  }
  for (const edge of current.edges) {
    const a = current.nodes.get(edge.source), b = current.nodes.get(edge.target);
    let path, x, y;
    if (a === b) {
      const lift = 48 + 20 * Math.abs(edge.bend);
      const top = a.y - a.halfHeight;
      path = `M ${a.x - 22} ${top} C ${a.x - 55} ${top - lift}, ${a.x + 55} ${top - lift}, ${a.x + 22} ${top}`;
      x = a.x;
      y = top - lift * .76;
    } else {
      const dx = b.x - a.x, dy = b.y - a.y;
      const length = Math.hypot(dx, dy) || 1;
      const bend = edge.bend * 72;
      const cx = (a.x + b.x) / 2 - dy * bend / length;
      const cy = (a.y + b.y) / 2 + dx * bend / length;
      const [sx, sy] = boundary(a, cx, cy);
      const [tx, ty] = boundary(b, cx, cy);
      path = `M ${sx} ${sy} Q ${cx} ${cy} ${tx} ${ty}`;
      x = (sx + 2 * cx + tx) / 4;
      y = (sy + 2 * cy + ty) / 4 - 8;
    }
    edge.path.setAttribute("d", path);
    edge.text.setAttribute("x", x);
    edge.text.setAttribute("y", y);
  }
}

function show(graph, positions, revision) {
  const previous = current?.nodes;
  nodeLayer.replaceChildren();
  edgeLayer.replaceChildren();
  const nodes = new Map();
  const lineHeight = 15;
  const tallest = Math.max(0, ...graph.nodes.map(node => node.landmarks.length));
  const rowHeight = Math.max(145, tallest * lineHeight + 70);
  for (const [index, modelNode] of graph.nodes.entries()) {
    const halfHeight = 18 + modelNode.landmarks.length * lineHeight / 2;
    const prior = previous?.get(modelNode.id);
    const [x, y] = prior ? [prior.x, prior.y]
      : positions[modelNode.id] ?? [
        140 + (index % 4) * 245,
        Math.max(95, halfHeight + 35) + Math.floor(index / 4) * rowHeight
      ];
    const group = element("g", {class: "node"}, nodeLayer);
    const box = element("rect", {y: -halfHeight, height: halfHeight * 2}, group);
    const text = element("text", {y: 18 - halfHeight}, group);
    text.textContent = modelNode.id;
    let textWidth = text.getComputedTextLength();
    for (const [index, name] of modelNode.landmarks.entries()) {
      const landmark = element("text", {class: "landmarks", y: 18 - halfHeight + (index + 1) * lineHeight}, group);
      landmark.textContent = name;
      textWidth = Math.max(textWidth, landmark.getComputedTextLength());
    }
    const halfWidth = Math.max(45, textWidth / 2 + 13);
    box.setAttribute("x", -halfWidth);
    box.setAttribute("width", halfWidth * 2);
    const node = {x, y, halfWidth, halfHeight, element: group};
    nodes.set(modelNode.id, node);
    group.addEventListener("pointerdown", event => {
      if (drag || event.button !== 0) return;
      const cursor = nodePoint(event);
      drag = {id: modelNode.id, node, pointer: event.pointerId, x: cursor.x - node.x, y: cursor.y - node.y};
      svg.setPointerCapture(event.pointerId);
    });
  }

  const groups = new Map();
  for (const edge of graph.edges) {
    const key = JSON.stringify([edge.source, edge.target].sort());
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(edge);
  }
  const edges = [];
  for (const group of groups.values()) {
    for (const [index, edge] of group.entries()) {
      const item = element("g", {class: "edge"}, edgeLayer);
      const path = element("path", edge.directed ? {"marker-end": "url(#arrow)"} : {}, item);
      element("title", {}, item).textContent = edge.rule;
      const text = element("text", {}, item);
      text.textContent = edge.label;
      const offset = edge.source === edge.target ? index : index - (group.length - 1) / 2;
      const bend = edge.source <= edge.target ? offset : -offset;
      edges.push({...edge, path, text, bend});
    }
  }
  const width = Math.max(1030, ...[...nodes.values()].map(node => node.x + node.halfWidth + 40));
  const height = Math.max(460, ...[...nodes.values()].map(node => node.y + node.halfHeight + 40));
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  current = {nodes, edges, width, height, revision};
  draw();
}

svg.addEventListener("pointermove", event => {
  if (!drag || drag.pointer !== event.pointerId) return;
  const cursor = nodePoint(event);
  const left = drag.node.halfWidth + 10;
  drag.node.x = Math.round(Math.max(left, Math.min(current.width - left, cursor.x - drag.x)));
  const top = drag.node.halfHeight + 10;
  drag.node.y = Math.round(Math.max(top, Math.min(current.height - top, cursor.y - drag.y)));
  draw();
});
svg.addEventListener("pointerup", async event => {
  if (!drag || drag.pointer !== event.pointerId) return;
  const {id, node} = drag;
  drag = null;
  try {
    const response = await fetch("/api/position", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({node: id, position: [node.x, node.y]})
    });
    if (!response.ok) throw new Error((await response.json()).error);
    latest.positions[id] = [node.x, node.y];
    saveError = null;
  } catch (error) {
    saveError = `Layout save failed: ${error.message}`;
    status.textContent = saveError;
  }
});
svg.addEventListener("lostpointercapture", () => { drag = null; });

function render() {
  statePanel.hidden = !latest.simulate;
  diagrams.classList.toggle("with-state", latest.simulate);
  if (!drag && latest.revision !== current?.revision) show(latest.graph, latest.positions, latest.revision);
  status.textContent = latest.error || saveError || (latest.graph.nodes.length ? "" : "No quantities to display.");

  if (!latest.simulate) return;
  stateGraph.hidden = !latest.has_state_graph;
  const source = `/state.svg?revision=${latest.revision}`;
  if (latest.has_state_graph && stateGraph.getAttribute("src") !== source) stateGraph.src = source;
  stateStatus.textContent = latest.simulation_error ? `State graph failed: ${latest.simulation_error}`
    : latest.has_state_graph || latest.error ? "" : "Simulation produced no valid states.";
}

async function refresh() {
  try {
    const response = await fetch("/api/model");
    if (!response.ok) throw new Error(response.statusText);
    latest = await response.json();
    render();
  } catch (error) {
    status.textContent = `Viewer connection lost: ${error.message}`;
  } finally {
    setTimeout(refresh, 750);
  }
}
refresh();
</script>
